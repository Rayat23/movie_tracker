<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track movies and TV series, manage watchlists, rate what you watch, log rewatches, and keep your viewing history in one private profile-aware app.">
  <meta name="application-name" content="Movie Tracker">
  <meta name="theme-color" content="#090A0F">
  <meta name="color-scheme" content="dark">

  <meta property="og:site_name" content="Movie Tracker">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Movie Tracker">
  <meta property="og:description" content="A private movie and TV tracker for watchlists, ratings, rewatches, diary history, and viewing stats.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rayat23.github.io/movie_tracker/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Movie Tracker">
  <meta name="twitter:description" content="Track movies and TV series, ratings, rewatches, watchlists, diary history, and stats.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movie Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="canonical" href="https://rayat23.github.io/movie_tracker/">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      background: #090a0f;
      color: #f7f2f2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .startup-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 24px;
      box-sizing: border-box;
      background: #090a0f;
    }

    .startup-screen[hidden], #startup-retry[hidden] { display: none; }

    .startup-card { max-width: 420px; text-align: center; }
    .startup-card h1 { margin: 20px 0 12px; font-size: 30px; }
    .startup-card p { color: #a5a3ab; line-height: 1.6; }

    .startup-indicator {
      width: 42px;
      height: 42px;
      margin: 0 auto;
      border: 3px solid #292b33;
      border-top-color: #e53935;
      border-radius: 50%;
      animation: startup-spin 1s linear infinite;
    }

    .startup-error .startup-indicator { animation: none; border-color: #e53935; }

    #startup-retry {
      margin-top: 12px;
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid #e53935;
      border-radius: 12px;
      background: #e53935;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #startup-retry:focus-visible, .project-inquiry-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @keyframes startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .startup-indicator { animation: none; } }

    .project-inquiry-link {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2147483647;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(17,19,26,.94);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      color: #f7f2f2;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .project-inquiry-link:hover {
      border-color: rgba(229,57,53,.6);
      background: rgba(35,22,24,.97);
    }

    @media (max-width: 899px) {
      .project-inquiry-link {
        right: 12px;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        min-height: 38px;
        padding: 0 12px;
        font-size: 12px;
      }
    }
  </style>

  <title>Movie Tracker</title>
</head>
<body>
  <noscript>
    <style>.startup-screen { display: none; }</style>
    <p>Enable JavaScript in your browser to use Movie Tracker.</p>
  </noscript>
  <div id="app-startup" class="startup-screen">
    <div class="startup-card">
      <div class="startup-indicator" aria-hidden="true"></div>
      <h1>Movie Tracker</h1>
      <p id="startup-message" role="status" aria-live="polite">Loading your movie and TV library…</p>
      <button id="startup-retry" type="button" hidden>Reload Movie Tracker</button>
    </div>
  </div>
  <a class="project-inquiry-link" href="services.html" aria-label="Open project inquiry services page">⚡ Need an app or automation?</a>
  <script src="startup.js" defer onerror="document.getElementById('app-startup').hidden = true"></script>
  <script id="flutter-bootstrap" src="flutter_bootstrap.js" defer></script>
</body>
</html>
