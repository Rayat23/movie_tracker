name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once this workflow is on main, run a no-cost health check every 6 hours.
    - cron: '17 */6 * * *'

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create safe API config for CI
        run: cp lib/config/api_config.example.dart lib/config/api_config.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Upload verified web build
        uses: actions/upload-artifact@v7
        with:
          name: movie-tracker-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
